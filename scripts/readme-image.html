<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The README picture: the app in a desktop window and in a phone, side by side.
     scripts/readme-image.sh takes a screenshot of this page. -->
<style>
  html, body { margin: 0; background: #16181d; }
  /* Blank until both apps have drawn, so the script can tell an early screenshot. */
  body:not(.ready) { visibility: hidden; }
  .row { display: flex; gap: 28px; padding: 36px; align-items: flex-start; }
  .shot { border: 1px solid #2a2e36; border-radius: 10px; overflow: hidden; }
  .shot iframe { border: 0; transform-origin: 0 0; display: block; }
  /* Each app shows a little smaller than its real window, so the picture fits the README width. */
  .desktop { width: 960px; height: 600px; }
  .desktop iframe { width: 1152px; height: 720px; transform: scale(0.8333333); }
  .mobile { width: 277px; height: 600px; }
  .mobile iframe { width: 320px; height: 693px; transform: scale(0.8658); }
</style>
</head>
<body>
  <div class="row">
    <div class="shot desktop"><iframe id="desktop"></iframe></div>
    <div class="shot mobile"><iframe id="mobile"></iframe></div>
  </div>
  <script type="module">
    // The settings in the picture. Each wallpaper is a custom size with the shape of its preset,
    // but smaller, so its shapes are big enough to see in the README.
    const SHOTS = {
      desktop: 'seed=570791&device=custom&w=1920&h=1080&colour=sodium&accents=8&glitch=0.4',
      mobile: 'seed=532919&device=custom&w=720&h=1560&colour=sodium&accents=6&glitch=0.4',
    };

    const load = (id) => new Promise((resolve) => {
      const frame = document.getElementById(id);
      frame.addEventListener('load', () => {
        // No fades, so the screenshot shows the final colours.
        const style = frame.contentDocument.createElement('style');
        style.textContent = '*, *::before, *::after { transition: none !important; }';
        frame.contentDocument.head.append(style);
        resolve();
      }, { once: true });
      frame.src = `/public/?${SHOTS[id]}`;
    });

    await Promise.all([load('desktop'), load('mobile')]);
    // Two frames later the apps have drawn and the styles above apply.
    requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('ready')));
  </script>
</body>
</html>
