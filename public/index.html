<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cyberpunk wallpaper generator | echus.co</title>
  <meta name="description" content="Generate minimal, glitchy cyberpunk wallpapers.">
  <!-- The card that shows when someone shares a link to the site. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wallpaper.echus.co/">
  <meta property="og:title" content="cyberpunk wallpaper generator | echus.co">
  <meta property="og:description" content="Generate minimal, glitchy cyberpunk wallpapers.">
  <meta property="og:image" content="https://wallpaper.echus.co/preview.jpg">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="600">
  <meta property="og:image:alt" content="The wallpaper generator: a control panel over an orange cyberpunk wallpaper">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
  <!-- Sets the mode before the page shows, so a light page does not show dark first.
       The mode comes from the address, then the last mode in this browser. app.js keeps it up to date. -->
  <script>
    try {
      const mode = new URLSearchParams(location.search).get('mode') ?? localStorage.getItem('mode');
      document.documentElement.dataset.mode = ['dim', 'light'].includes(mode) ? mode : 'dark';
    } catch {}
  </script>
  <!-- app.js draws the tab icon in the chosen colour. -->
  <link rel="icon" id="favicon">
</head>
<body>
  <main>
    <form id="controls" class="frame">
      <div class="title">
        <h1>&gt; wallpaper.exe</h1>
        <!-- The mode of the page and the wallpaper: night, dim or day. app.js keeps it in the hidden field.
             The moon and sun are from Pixelarticons (MIT, Gerrit Halfmann). The sunset is its sun cut by a horizon. -->
        <div id="modes" role="radiogroup" aria-label="Mode">
          <button type="button" role="radio" value="dark" aria-label="night" title="night">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 22H8v-2h10v2ZM8 20H6v-2h2v2Zm12 0h-2v-2h2v2ZM6 18H4v-2h2v2Zm16 0h-2v-4h-2v-2h2v-2h2v8ZM4 16H2V6h2v10Zm14 0h-6v-2h6v2Zm-6-2h-2v-2h2v2Zm-2-2H8V6h2v6ZM6 6H4V4h2v2Zm8-2h-2v2h-2V4H6V2h8v2Z" />
            </svg>
          </button>
          <button type="button" role="radio" value="dim" aria-label="dim" title="dim">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 6h2v3h-2zM5 9h2v2H5zM17 9h2v2h-2zM9 11h6v2H9zM7 13h2v4H7zM15 13h2v4h-2zM2 15h3v2H2zM19 15h3v2h-3zM2 19h20v2H2z" />
            </svg>
          </button>
          <button type="button" role="radio" value="light" aria-label="day" title="day">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M13 22h-2v-3h2v3Zm-6-3H5v-2h2v2Zm12 0h-2v-2h2v2Zm-4-2H9v-2h6v2Zm-6-2H7V9h2v6Zm8 0h-2V9h2v6ZM5 13H2v-2h3v2Zm17 0h-3v-2h3v2Zm-7-4H9V7h6v2ZM7 7H5V5h2v2Zm12 0h-2V5h2v2Zm-6-2h-2V2h2v3Z" />
            </svg>
          </button>
        </div>
        <input name="mode" type="hidden">
      </div>
      <!-- The hidden prompt is as wide as the "> " in the title, so the line starts under "wallpaper". -->
      <p class="byline"><span class="indent" aria-hidden="true">&gt; </span>by <a href="https://echus.co" target="_blank" rel="noopener">echus.co</a></p>

      <label><span class="name">Seed</span>
        <span class="joined">
          <input name="seed" type="number" min="0" max="999999" step="1">
          <button type="button" id="new-seed">generate</button>
        </span>
      </label>

      <label><span class="name">Colour</span>
        <span class="stack">
          <!-- The button shows the chosen colour with its swatch. app.js adds the options. -->
          <select name="palette">
            <button><selectedcontent></selectedcontent></button>
          </select>
          <input name="accent" type="color" id="custom" aria-label="Custom colour" hidden>
        </span>
      </label>

      <!-- On a narrow screen these settings are folded away. The button opens them (see app.js).
           On a wide screen the button is hidden and the settings always show. -->
      <button type="button" id="more-toggle" aria-expanded="false" aria-controls="more">more settings</button>
      <div id="more">
        <label><span class="name">Size</span>
          <span class="stack">
            <!-- Each device has an icon to the left of its name. -->
            <select name="device">
              <button><selectedcontent></selectedcontent></button>
              <option value="mobile">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                  <rect x="4.5" y="1.5" width="7" height="13" rx="1" />
                  <path d="M7 12.5h2" />
                </svg>
                mobile
              </option>
              <option value="desktop">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                  <rect x="1.5" y="2.5" width="13" height="9" rx="0.5" />
                  <path d="M8 11.5v3M5 14.5h6" />
                </svg>
                desktop
              </option>
              <option value="custom">
                <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4" />
                </svg>
                custom
              </option>
            </select>
            <span id="size" hidden>
              <input name="width" type="number" min="320" max="7680" step="1" aria-label="Width">
              <input name="height" type="number" min="320" max="7680" step="1" aria-label="Height">
            </span>
          </span>
        </label>

        <label><span class="name">Accents</span>
          <span class="slider">
            <input name="accents" type="range" min="0" max="99" step="1">
            <output name="accentsValue"></output>
          </span>
        </label>

        <label><span class="name">Glitch</span>
          <span class="slider">
            <input name="glitch" type="range" min="0" max="1" step="0.05">
            <output name="glitchValue"></output>
          </span>
        </label>
      </div>

      <button type="button" id="download">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path d="M8 2v12M3.5 9.5 8 14l4.5-4.5" />
        </svg>
        download png
      </button>
    </form>

    <div class="preview">
      <canvas id="wallpaper" aria-label="Wallpaper preview"></canvas>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
