<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyberpunk Wallpaper Generator</title>
  <meta name="description" content="Generate minimal, glitchy cyberpunk wallpapers for phone and desktop.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <form id="controls" class="frame">
      <h1>&gt; wallpaper.exe</h1>

      <label>Seed
        <span class="joined">
          <input name="seed" type="number" min="0" max="999999" step="1">
          <button type="button" id="new-seed">New seed</button>
        </span>
      </label>

      <label>Device
        <span class="stack">
          <select name="device">
            <option value="phone">Phone</option>
            <option value="desktop">Desktop</option>
            <option value="custom">Custom</option>
          </select>
          <span id="size" hidden>
            <input name="width" type="number" min="320" max="7680" step="1" aria-label="Width">
            <input name="height" type="number" min="320" max="7680" step="1" aria-label="Height">
          </span>
        </span>
      </label>

      <label>Colour
        <span class="stack">
          <!-- The button shows the chosen colour with its swatch. app.js adds the options. -->
          <select name="palette">
            <button><selectedcontent></selectedcontent></button>
          </select>
          <input name="accent" type="color" id="custom" aria-label="Custom colour" hidden>
        </span>
      </label>

      <label>Glitch <output name="glitchValue"></output>
        <input name="glitch" type="range" min="0" max="1" step="0.05">
      </label>

      <button type="button" id="download">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path d="M8 2v10M3.5 7.5 8 12l4.5-4.5M2 14.5h12" />
        </svg>
        Download PNG
      </button>
    </form>

    <div class="preview">
      <div class="frame">
        <canvas id="wallpaper" aria-label="Wallpaper preview"></canvas>
      </div>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
